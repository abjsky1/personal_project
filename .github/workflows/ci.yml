# GitHub Actions CI/CD 설정 파일
# GitHub은 .github/workflows/ 폴더 안의 yml 파일을 찾아서 자동으로 실행한다.
# 실제 검사·배포 명령은 gradlew·deploy.sh 스크립트를 그대로 쓰고, 이 파일에는 "언제, 어떤 순서로 실행할지"만 적는다.
# → 나중에 Jenkins 같은 다른 CI로 옮겨도 같은 명령을 그대로 쓸 수 있다.
#
# 흐름 (S4-5 자동 배포)
#   PR:        backend(빌드·테스트)만 실행 → 결과가 PR 화면에 표시된다
#   main push: backend → image(Docker 이미지를 만들어 GHCR에 올림) → deploy(서버가 그 이미지를 받아 교체)
#   되돌리기: 서버에서  bash deploy/deploy.sh <예전 커밋 SHA>

# Actions 탭과 PR 화면에 보이는 이름
name: CI

# 언제 실행할지
on:
  # main으로 합치려는 PR을 열 때, 그리고 그 PR의 브랜치에 커밋을 push할 때마다
  pull_request:
    branches: [main]
  # main에 합쳐진 뒤에도 한 번 더 실행해서, 합친 결과도 정상인지 확인한다
  push:
    branches: [main]

# 이 CI가 저장소에 할 수 있는 일: 코드 읽기만 (검사만 하므로 쓰기 권한은 주지 않는다)
permissions:
  contents: read

# job = 따로 실행되는 작업 묶음
# job마다 따로 가상 머신에서 실행되고, PR 화면에 job별로 검사 결과가 표시된다. (지금은 backend 하나)
jobs:
  backend:
    # GitHub이 빌려주는 Ubuntu(리눅스) 가상 머신에서 실행한다.
    # 매번 새 머신이라 이전 실행의 흔적이 없다. (내 PC에서만 되는 설정이 있으면 여기서 드러난다)
    runs-on: ubuntu-latest
    # 무언가 멈춰서 끝나지 않으면 15분 뒤 실패로 처리한다 (무료 사용 시간 낭비 방지)
    timeout-minutes: 15
    # 이 job의 모든 단계에서 쓸 수 있는 환경 변수
    env:
      # CI에서 잠깐 띄웠다가 버리는 MySQL의 비밀번호 (내 PC .env의 값과는 다르다)
      # compose.yaml은 이 값으로 MySQL을 만들고, application.properties의 ${MYSQL_PASSWORD}도 이 값을 읽는다.
      MYSQL_PASSWORD: cipassword
      MYSQL_ROOT_PASSWORD: cirootpassword
    # steps: 위에서부터 차례로 실행되는 단계. 하나라도 실패하면 거기서 멈추고 job이 실패(❌)한다.
    steps:
      # uses: 다른 사람이 만들어 둔 단계(Action)를 가져다 쓴다. @ 뒤는 버전
      # checkout: 저장소 코드를 가상 머신으로 내려받는다 (git clone과 비슷)
      - uses: actions/checkout@v7

      # 로컬·운영과 같은 Amazon Corretto 17을 설치한다
      # cache: gradle → Gradle이 내려받은 라이브러리를 저장해 두고 다음 실행 때 재사용한다 (실행 속도 단축)
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      # run: 가상 머신의 터미널에서 직접 실행할 명령
      # 로컬에서 쓰는 compose.yaml 그대로 MySQL을 띄운다.
      # -d: 백그라운드로 실행 / --wait: compose.yaml의 healthcheck가 통과(MySQL 준비 완료)할 때까지 기다린 뒤 다음 단계로
      - name: MySQL 실행
        run: docker compose up -d --wait mysql

      # build = 컴파일 + 테스트 + war 만들기. 테스트가 하나라도 실패하면 여기서 실패(❌)
      # 테스트(@SpringBootTest)가 위에서 띄운 MySQL에 실제로 접속하고, JPA가 엔티티를 보고 테이블을 만드는 과정까지 거친다.
      - name: 빌드·테스트
        working-directory: backend
        run: ./gradlew build

  # ---- 아래 두 job은 main에 push됐을 때만 실행된다 (PR에서는 검사만) ----

  # Docker 이미지를 GitHub 컴퓨터에서 만들어 GHCR(GitHub 컨테이너 저장소)에 올린다.
  # 서버(2GB)에서 빌드하지 않으므로 사용자가 쓰는 중에도 서버가 느려지지 않는다.
  image:
    # backend(테스트)가 통과해야 시작한다
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # GHCR에 이미지를 올리려면 packages 쓰기 권한이 필요하다 (GITHUB_TOKEN은 GitHub이 실행마다 만들어 주는 임시 열쇠)
      packages: write
    steps:
      - uses: actions/checkout@v7
      # buildx: Dockerfile의 --mount=type=cache 같은 BuildKit 기능을 쓰기 위해
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 태그 두 개: 커밋 SHA(되돌리기용, 어느 코드로 만든 이미지인지 확실) + latest(최신)
      # cache: 바뀌지 않은 단계(기본 이미지 등)는 지난 실행의 결과를 재사용한다
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/macros-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/macros-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 서버에 "새 이미지로 바꿔라"를 전달한다.
  # SSH 대신 AWS SSM(Systems Manager)으로 명령을 보낸다: 서버의 22번 포트를 GitHub에 열 필요도, SSH 키를 GitHub에 맡길 필요도 없다.
  # AWS 접속 권한은 OIDC로 받는다: GitHub이 "이 실행은 abjsky1/personal_project의 main이다"라고 증명하면 AWS가 임시 권한을 준다 (비밀값 저장 없음).
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 배포는 한 번에 하나만. 먼저 시작한 배포가 끝날 때까지 다음 배포는 기다린다.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      # OIDC 증명서(id-token)를 발급받기 위해
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      INSTANCE_ID: i-0f4506ea91b8a4fc9
    steps:
      # AWS_DEPLOY_ROLE_ARN: 저장소 Settings → Variables에 넣어 둔 배포용 IAM 역할 주소
      # 역할의 신뢰 정책에 적는 sub는 새 형식 repo:abjsky1@231160078/personal_project@1437024222:ref:refs/heads/main
      # (2026-07-15 이후 만든 저장소는 이름 뒤에 고유 번호가 붙는다 → docs/troubleshooting/2026-11-04-github-oidc-sub-claim.md)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 서버에서 ec2-user로: 최신 코드 받기(deploy 폴더의 설정·스크립트) → deploy.sh <커밋 SHA>
      - name: 서버에 배포 명령 보내기 (SSM)
        id: send
        run: |
          SCRIPT="cd /home/ec2-user/personal_project && git pull --ff-only --quiet && bash deploy/deploy.sh $GITHUB_SHA"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA:0:7}" \
            --parameters "commands=[\"runuser -u ec2-user -- bash -lc '$SCRIPT'\"],executionTimeout=[\"900\"]" \
            --query Command.CommandId --output text)
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      # 서버의 실행이 끝날 때까지 10초마다 확인하고, 서버가 찍은 출력을 그대로 보여 준다
      - name: 서버 결과 기다리기
        run: |
          CMD_ID="${{ steps.send.outputs.cmd_id }}"
          for i in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue;; esac
            break
          done
          echo "---- 서버 출력 ----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
          echo "---- 상태: $STATUS ----"
          [ "$STATUS" = "Success" ] || exit 1

      # 밖에서 실제 주소로 확인한다 (nginx·https까지 거쳐서 응답하는지)
      - name: 사이트 확인
        run: |
          for i in $(seq 1 12); do
            curl -fsS https://jjikmuk.com/actuator/health && exit 0
            sleep 5
          done
          echo "사이트가 응답하지 않습니다"; exit 1
