plugins {
	id 'java'
	// war: 빌드 결과를 .jar 대신 .war로 만든다. Spring Boot에서 JSP는 war로 실행할 때만 동작한다.
	// (실행 방법은 같다: java -jar backend.war)
	id 'war'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'backend'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
		// 운영(AWS)과 같은 Amazon Corretto로만 빌드·테스트한다 (다른 회사 JDK 17은 쓰지 않음)
		vendor = JvmVendorSpec.AMAZON
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 비밀번호를 BCrypt로 바꿔 저장하는 도구만 가져온다 (로그인 기능이 있는 Spring Security 전체는 넣지 않음)
	implementation 'org.springframework.security:spring-security-crypto'
	// Thumbnailator: 사진 크기 줄이기·썸네일 만들기. 사진의 EXIF 방향 정보를 읽어 세로 사진을 똑바로 세워 준다.
	// Spring Boot가 버전을 관리하지 않는 라이브러리라 버전을 직접 적는다.
	implementation 'net.coobird:thumbnailator:0.4.21'
	// metadata-extractor: 사진 원본의 EXIF에서 GPS 위치와 촬영 시각을 읽는다. (버전 직접 지정)
	implementation 'com.drewnoakes:metadata-extractor:2.21.0'
	// Bucket4j: 업로드 횟수 제한(1분에 몇 번, 하루에 몇 번)을 계산한다. (버전 직접 지정)
	implementation 'com.bucket4j:bucket4j_jdk17-core:8.21.0'
	// Caffeine: IP별 남은 횟수를 메모리에 보관하고, 오래 안 쓴 IP는 자동으로 지운다. (버전은 Spring Boot가 관리)
	implementation 'com.github.ben-manes.caffeine:caffeine'
	// JSP를 실행 가능한 코드로 바꿔 주는 엔진 (내장 Tomcat용)
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
	// JSTL: JSP에서 <c:forEach>, <c:if> 같은 태그를 쓰게 해 준다 (규격 + 실제 구현 두 개가 한 쌍)
	implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'
	implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl'
	// Lombok: 생성자·getter 같은 반복 코드를 컴파일할 때 자동으로 만들어 준다.
	// compileOnly: 컴파일할 때만 쓰고 실행 파일(war)에는 넣지 않는다 / annotationProcessor: 컴파일 중에 코드를 만들어 주는 도구로 등록
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
