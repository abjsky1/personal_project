spring.application.name=backend

# 루트의 .env를 읽어 온다 (Spring은 .env를 자동으로 읽지 않음). backend/ 폴더에서 실행하는 기준의 경로
spring.config.import=optional:file:../.env[.properties]

# Docker MySQL (compose.yaml: 내 PC 3311 → 컨테이너 3306)
spring.datasource.url=jdbc:mysql://localhost:3311/macros
spring.datasource.username=macros
spring.datasource.password=${MYSQL_PASSWORD}

# 테이블을 어떻게 만들지: update = 엔티티(@Entity)를 보고 없는 테이블·컬럼을 JPA가 자동으로 추가한다.
# 컬럼 이름 변경·삭제는 자동으로 하지 않는다 → 엔티티를 크게 바꿨으면 로컬 DB를 지우고 다시 만든다.
# (운영 DB에서는 자동 변경을 끄는 게 일반적이라, 운영 방식은 S4 배포 때 정한다)
spring.jpa.hibernate.ddl-auto=update
# 요청이 끝날 때까지 DB 커넥션을 붙잡지 않게 한다
spring.jpa.open-in-view=false

# JPA가 실행하는 SQL을 로그로 보여 준다.
# spring.jpa.show-sql=true 대신 이 방식을 쓰는 이유: show-sql은 로그 시스템을 거치지 않고 화면에 바로 찍어서 [traceId]가 붙지 않는다.
logging.level.org.hibernate.SQL=debug
# SQL을 한 줄로 길게 찍지 않고 줄바꿈해서 읽기 좋게 보여 준다
spring.jpa.properties.hibernate.format_sql=true

# JSP 화면 파일 위치: Controller가 "posts/list"를 돌려주면 앞뒤를 붙여 /WEB-INF/views/posts/list.jsp를 보여 준다
# (실제 폴더: src/main/webapp/WEB-INF/views/)
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 업로드 크기 한도. 기본값은 파일 1MB라서 휴대폰 사진(보통 3~5MB)이 거절된다.
# max-file-size: 파일 하나 / max-request-size: 요청 전체(사진 + 닉네임 등 글자)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# 한도를 넘은 요청도 Tomcat이 끝까지 받아 준 뒤 거절하게 한다.
# 기본값(2MB)이면 2MB 넘게 초과한 요청은 응답 없이 연결을 끊어 버려서, 사용자는 "연결 끊김"만 보게 된다.
server.tomcat.max-swallow-size=20MB

# 올린 사진을 저장할 폴더 (backend/ 폴더에서 실행하는 기준 → 프로젝트 루트의 uploads/)
# app.으로 시작하는 이름은 Spring이 아니라 이 프로젝트가 직접 정한 설정
app.upload-dir=../uploads

# 로컬 확인용: /actuator/health에 DB 상태까지 표시 (운영에서는 끈다)
management.endpoint.health.show-details=always

# 로그 한 줄마다 [traceId]를 붙인다. (TraceIdFilter가 MDC에 적어 둔 값)
# %correlationId{traceId(8)}: MDC의 traceId 값을 8칸 자리에 찍는 Spring Boot의 로그 형식
# → 요청 중에 찍힌 로그는 [4861e423], 요청 밖에서 찍힌 로그(서버 시작 등)는 [        ]처럼 빈칸으로 줄이 맞춰진다.
logging.pattern.correlation=%correlationId{traceId(8)}
