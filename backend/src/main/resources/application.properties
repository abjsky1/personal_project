spring.application.name=backend

# 루트의 .env를 읽어 온다 (Spring은 .env를 자동으로 읽지 않음). backend/ 폴더에서 실행하는 기준의 경로
spring.config.import=optional:file:../.env[.properties]

# Docker MySQL (compose.yaml: 내 PC 3311 → 컨테이너 3306)
spring.datasource.url=jdbc:mysql://localhost:3311/macros
spring.datasource.username=macros
spring.datasource.password=${MYSQL_PASSWORD}

# 테이블을 어떻게 만들지: update = 엔티티(@Entity)를 보고 없는 테이블, 컬럼을 JPA가 자동으로 추가한다.
# 컬럼 이름 변경, 삭제는 자동으로 하지 않는다 → 엔티티를 크게 바꿨으면 로컬 DB를 지우고 다시 만든다.
# (첫 배포도 update로 간다. 배포 서버 전용 설정은 application-prod.properties)
spring.jpa.hibernate.ddl-auto=update
# 요청이 끝날 때까지 DB 커넥션을 붙잡지 않게 한다
spring.jpa.open-in-view=false
# enum 컬럼에 CHECK 제약을 만들지 않는 MySQL 설정 (이유는 클래스 주석)
spring.jpa.database-platform=backend.common.NoColumnCheckMySQLDialect

# JPA가 실행하는 SQL을 로그로 보여 준다.
# spring.jpa.show-sql=true 대신 이 방식을 쓰는 이유: show-sql은 로그 시스템을 거치지 않고 화면에 바로 찍어서 [traceId]가 붙지 않는다.
logging.level.org.hibernate.SQL=debug
# SQL을 한 줄로 길게 찍지 않고 줄바꿈해서 읽기 좋게 보여 준다
spring.jpa.properties.hibernate.format_sql=true

# JSP 화면 파일 위치: Controller가 "posts/list"를 돌려주면 앞뒤를 붙여 /WEB-INF/views/posts/list.jsp를 보여 준다
# (실제 폴더: src/main/webapp/WEB-INF/views/)
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# JSP 개발 모드: JSP 파일을 고치면 서버를 다시 켜지 않아도 새로고침만으로 반영된다. (기본값은 꺼짐)
# 매 요청마다 파일이 바뀌었는지 확인해서 조금 느려지므로, 배포 서버에서는 끈다. (application-prod.properties)
server.servlet.jsp.init-parameters.development=true
# JSP 엔진(Jasper)이 "미리 컴파일 신호"로 보는 주소 값의 이름 (JM-107)
# 기본값 jsp_precompile이면 주소 어디에든 이 글자가 있을 때 화면을 그리지 않고 컴파일만 하거나(빈 화면),
# 값이 true, false가 아니면 예외를 던진다(500, ERROR 로그 → 운영에서는 에러 알림 메일). 찍먹은 이 기능을 쓰지 않는다.
# 그래서 빈칸이 든 이름으로 바꿔 둔다. 요청 줄의 주소에는 빈칸이 그대로 들어올 수 없어서(빈칸은 %20이나 +로 온다) 이 신호는 다시 생기지 않는다
server.servlet.jsp.init-parameters.jspPrecompilationQueryParameter=jsp precompile off

# PUT, PATCH, DELETE로 온 form 본문을 Spring이 직접 읽어 두는 필터(FormContentFilter)를 끈다 (JM-107)
# 찍먹에는 form을 받는 PUT, DELETE가 없고, PATCH(운영자 API의 피드백 고치기)는 JSON을 받는다.
# 켜 두면 이 필터가 깨진 값(%zz)을 읽다가 예외를 내는데, Spring MVC보다 앞이라 예외 처리가 받지 못해 500과 ERROR(에러 알림 메일)가 됐다
spring.mvc.formcontent.filter.enabled=false

# 업로드 크기 한도. 기본값은 파일 1MB라서 휴대폰 사진(보통 3~5MB)이 거절된다.
# max-file-size: 파일 하나 / max-request-size: 요청 전체(사진 + 닉네임 등 글자)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# 한도를 넘은 요청도 Tomcat이 끝까지 받아 준 뒤 거절하게 한다.
# 기본값(2MB)이면 2MB 넘게 초과한 요청은 응답 없이 연결을 끊어 버려서, 사용자는 "연결 끊김"만 보게 된다.
server.tomcat.max-swallow-size=20MB

# 세션 번호를 쿠키로만 주고받는다.
# 기본값이면 Tomcat이 주소 뒤에 ;jsessionid=번호를 붙이는 경우가 있다 (예: 삭제 실패 후 돌아가는 주소).
# 주소에 세션 번호가 남으면 로그, 공유 링크로 새어 나갈 수 있어서 막는다.
server.servlet.session.tracking-modes=cookie
# 다른 사이트에서 보낸 form 전송에는 세션 쿠키를 싣지 않는다 (lax). 링크를 눌러 들어오는 것은 그대로 된다.
# 세션으로 "이 브라우저가 방금 올린 글"을 기억해서 비밀번호 없이 확정할 수 있게 했는데(JM-74),
# 다른 사이트에 숨겨 둔 form이 그 권한을 빌려 쓰지 못하게 한다.
server.servlet.session.cookie.same-site=lax

# 사진 한 장의 최대 화소 수 (가로 × 세로). 5,000만 화소 = 예: 8,660 × 5,770
# 파일 용량(10MB)이 작아도 화소가 많으면 메모리로 펼칠 때 수백 MB를 쓸 수 있어서 따로 제한한다.
app.image.max-pixels=50000000
# 펼친 사진 한 장의 최대 바이트 (가로 × 세로 × 화소 하나의 바이트, JM-105)
# 화소 수가 한도 안이어도 투명 PNG(화소당 4바이트)나 16비트 PNG(8바이트)는 펼치면 2억 ~ 4억 바이트가 되어 운영 힙(512 MB)에서 메모리가 모자란다.
# 자바 그리기가 바로 줄이지 못하는 형식(16비트 PNG, 회색+투명 PNG, 1 ~ 4비트 팔레트 PNG, CMYK JPEG)은 줄이는 동안의 복사본 몫으로 화소당 8바이트를 더 센다.
# 1억 5천만 = 5,000만 화소 휴대폰 사진(8,160 × 6,120, 화소당 3바이트)이 들어가는 크기. 보통 JPEG는 5,000만 화소까지 모두 이 안이다
app.image.max-decoded-bytes=150000000

# Gemini API (Google AI Studio)
# 키는 이 파일에 직접 쓰지 않고 .env의 GEMINI_API_KEY에서 읽는다. (.env는 Git에 올라가지 않는다)
# ${GEMINI_API_KEY:}: 값이 없으면 빈 값으로 둔다 → 키가 없는 CI, 테스트에서도 서버가 켜진다. (테스트는 실제 AI를 부르지 않는다)
app.gemini.api-key=${GEMINI_API_KEY:}
# 쓸 모델 이름. 음식 사진 20장으로 비교해서 정했다 (docs/ai-model-comparison.md)
app.gemini.model=gemini-3.5-flash-lite

# 운영자 API(/api/admin/**)의 열쇠. 서버의 .env에 APP_ADMIN_TOKEN으로 넣는다 (긴 무작위 문자열, openssl rand -hex 24).
# 비어 있으면 운영자 기능이 꺼진다(모든 요청 403) → 개발 PC, CI에서는 비워 둔다. 쓰는 법은 기획서 16절
app.admin.token=${APP_ADMIN_TOKEN:}

# 관리자 화면 (/admin, JM-82). 처음 등록한 노트북 브라우저에서만, 관리자 비밀번호로 들어간다 (등록은 DB의 admin_device).
# 비밀번호는 서버 .env의 APP_ADMIN_PASSWORD. 비어 있으면 관리자 화면이 꺼진다(없는 주소). 운영자 API의 열쇠와 따로 둔다
app.admin.password=${APP_ADMIN_PASSWORD:}
# 한 번 들어가면 관리자로 기억하는 시간 (분)
app.admin.session-minutes=120

# 전체 하루 분석 횟수 상한 (한국 시간 자정 기준). AI 호출 비용이 예상보다 많이 나가는 것을 막는다.
# 넘으면 글은 올라가지만 그 사진은 분석하지 않는다. 지인 베타에 충분한 숫자로 시작하고, 쓰임을 보고 조정한다.
# 2026-11-13 (JM-79): 200에서 500으로. 업로드 하루 전체 상한(app.rate-limit.upload-total-per-day)과 맞춰, 올라온 사진은 모두 분석되게 한다
app.analysis.daily-limit=500

# 뒤에서 AI 분석을 하는 일꾼 스레드 수. 2명이 동시에 분석하고, 나머지 요청은 줄(최대 50건)에서 기다린다.
# 크기를 정하지 않으면 줄이 끝없이 길어질 수 있다. 줄까지 가득 차면 그 글은 PENDING으로 남았다가 몇 분 뒤 다시 줄에 들어간다 (아래 JM-110).
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=2
spring.task.execution.pool.queue-capacity=50
# 끌 때(배포로 옛 app을 내릴 때): 기본값 그대로 둔다. Spring 7은 끄는 단계에서 일꾼이 하던 분석이 끝나기를 DB를 연 채로 기다린다
# (spring.lifecycle.timeout-per-shutdown-phase, 기본 30초). 줄에서 아직 시작하지 않은 분석은 버려진다 (그 글은 PENDING으로 남는다).
# spring.task.execution.shutdown.await-termination=true는 넣지 않는다: 기다림이 DB 연결을 닫은 뒤로 밀려서 하던 분석이
# "Could not open JPA EntityManager"로 실패하고 에러 알림이 울린다 (2026-11-23 JM-62 PR 전 검토에서 재현)

# 줄에서 버려진 분석을 다시 줄에 넣기 (JM-110, PendingAnalysisRequeuer). 끌 때 줄에서 기다리던 분석과 줄이 가득 차서 넣지 못한 분석은
# PENDING으로 남는다. 켜진 지 2분 뒤부터 5분마다, 만든 지 3분이 넘고 하루가 안 된 PENDING을 오래된 것부터 한 번에 10개까지 다시 넣는다.
# 같은 글이 두 번 들어가도 분석을 시작할 때 맡기(claimed_at)를 해서 AI는 한 번만 부른다. 맡은 지 3분이 지나도 PENDING이면(끌 때 끊긴 분석) 다시 맡는다
app.analysis.requeue.enabled=true
app.analysis.requeue.initial-delay=PT2M
app.analysis.requeue.interval=PT5M
app.analysis.requeue.min-age=PT3M
app.analysis.requeue.max-age=P1D
app.analysis.requeue.batch-size=10

# 태그가 없는 글의 태그 채우기 (JM-83, PostTagFiller). 새 글은 분석할 때 태그가 함께 오고, 태그가 생기기 전의 지난 글과
# 태그 저장에 실패한 글은 이것이 사진을 AI에 다시 보내 채운다. 켜진 지 3분 뒤부터 5분마다, 최신 글부터 한 번에 20개까지
# (지난 글 161개가 배포 뒤 40분쯤에 다 채워진다. 차례로 부르므로 한 번에 40초쯤).
# 한 글은 3번까지만 맡고, 오늘 분석 횟수 상한(app.analysis.daily-limit)에 닿으면 멈춘다 (태그 호출도 그 횟수에 센다)
app.tags.fill.enabled=true
app.tags.fill.initial-delay=PT3M
app.tags.fill.interval=PT5M
app.tags.fill.batch-size=20
# 일정(@Scheduled) 전용 스레드 수. 기본은 하나라서, 태그 채우기가 AI를 기다리는 동안 분석 다시 넣기가 밀린다 (PR 전 검토). 둘이면 따로 돈다
spring.task.scheduling.pool.size=2

# 업로드 횟수 제한. 도배로 저장 공간과 AI 분석 한도를 다 써 버리는 것을 막는다. (기획서 7절, UploadLimiter)
# 같은 와이파이(카페, 강의실)를 쓰는 사람들은 IP 하나를 나눠 쓰므로, 브라우저(세션 쿠키)마다 세고 IP와 전체에는 하루 상한만 둔다 (JM-79)
# 하루는 한국 날짜 기준. IP에는 1분 제한이 없다
app.rate-limit.upload-per-browser-per-minute=5
app.rate-limit.upload-per-browser-per-day=30
app.rate-limit.upload-per-ip-per-day=200
app.rate-limit.upload-total-per-day=500

# 좋아요 횟수 제한 (글 하나 기준, JM-59). 누른 글은 브라우저가 기억해서 다시 누를 수 없고, 여기서는 스크립트로 숫자를 부풀리는 것만 막는다.
# IP를 쓰지 않고 "글 하나가 받을 수 있는 좋아요 수"를 제한한다 (처리방침에서 IP는 업로드 횟수 제한에만 쓴다고 했다)
app.rate-limit.like-per-post-per-minute=30
app.rate-limit.like-per-post-per-day=300

# 개인정보처리방침에 공개하는 문의 이메일 (개인정보 보호책임자 연락처)
app.contact-email=dev_an@naver.com

# 사진 저장소: local = 내 PC 폴더(개발), s3 = AWS S3(배포 서버)
# 배포 서버에서는 application-prod.properties가 s3로 바꾸고, 버킷 이름은 환경 변수 APP_S3_BUCKET으로 받는다.
# (Spring은 환경 변수를 설정 이름으로 자동 연결한다: APP_S3_BUCKET → app.s3.bucket)
app.image-storage=local
# S3 설정 (app.image-storage=s3일 때만 쓴다). ap-northeast-2 = 서울 지역
app.s3.bucket=
app.s3.region=ap-northeast-2

# 올린 사진을 저장할 폴더 (local일 때만 쓴다. backend/ 폴더에서 실행하는 기준 → 프로젝트 루트의 uploads/)
# app.으로 시작하는 이름은 Spring이 아니라 이 프로젝트가 직접 정한 설정
app.upload-dir=../uploads

# IP 위치 파일 (JM-86, DB-IP 무료판 .mmdb). 비어 있거나 파일이 없으면 방문 지역을 모두 "알 수 없음"으로 센다 (내 PC, 테스트)
# 배포 서버에서는 application-prod.properties가 서버의 경로를 넣는다
app.geoip.path=

# 사용자 흐름(JM-92)은 화면 응답 밖에서 일꾼 스레드 하나가 저장한다 (줄 1000개까지, 가득 차면 버린다. PageFlowRecorder)
# false면 요청 스레드에서 바로 저장한다 (테스트가 이렇게 쓴다: src/test/resources/config/application.properties)
app.page-flow.async=true
# 하루(한국 날짜)에 받는 흐름 줄의 상한. 줄은 지우지 않고 모두 보관하므로, 쿠키를 안 쓰는 스크립트가 끝없이 늘리지 못하게 막는다.
# 지금 사람의 화면은 하루 400번쯤이라 50배쯤 여유를 둔다. 넘으면 그날 남은 줄은 버리고 1분에 한 번 경고 로그를 남긴다
app.page-flow.daily-limit=20000

# MyBatis: SQL을 적어 둔 XML 파일의 위치 (운영자 통계, JM-68)
mybatis.mapper-locations=classpath:mapper/*.xml
# 같은 트랜잭션 안에서 쿼리 결과를 기억해 두지 않는다. JPA가 저장한 내용을 MyBatis는 모르기 때문에, 기억해 두면 옛 숫자를 돌려줄 수 있다.
mybatis.configuration.local-cache-scope=statement

# 로컬 확인용: /actuator/health에 DB 상태까지 표시 (운영에서는 끈다)
management.endpoint.health.show-details=always

# 로그 한 줄마다 [traceId]를 붙인다. (TraceIdFilter가 MDC에 적어 둔 값)
# %correlationId{traceId(8)}: MDC의 traceId 값을 8칸 자리에 찍는 Spring Boot의 로그 형식
# → 요청 중에 찍힌 로그는 [4861e423], 요청 밖에서 찍힌 로그(서버 시작 등)는 [        ]처럼 빈칸으로 줄이 맞춰진다.
logging.pattern.correlation=%correlationId{traceId(8)}
