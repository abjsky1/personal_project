# 배포 서버 전용 설정. 환경 변수 SPRING_PROFILES_ACTIVE=prod일 때만 읽는다. (deploy/compose.yaml이 넣어 준다)
# application.properties를 먼저 읽고, 같은 이름의 설정은 이 파일 값으로 덮어쓴다. 여기 없는 설정은 application.properties 값 그대로.
# 비밀값(DB 비밀번호, API 키)은 여기에도 쓰지 않는다 → 서버의 .env → compose.yaml → 환경 변수로 들어온다.

# DB: AWS RDS(MySQL). 주소는 환경 변수 DB_HOST로 받는다 (RDS 화면의 "엔드포인트", 3306 = MySQL 기본 포트)
# 사용자 이름(macros)·비밀번호(MYSQL_PASSWORD)는 application.properties 설정을 그대로 쓴다 → RDS를 만들 때 같은 값으로 맞춘다.
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/macros

# 테이블은 개발과 같이 ddl-auto=update로 자동으로 만든다 (첫 배포 결정, 기획서 18절)
# update는 없는 테이블·컬럼을 추가만 하고 지우거나 이름을 바꾸지는 않는다. 그런 변경이 필요해지면 그때 SQL을 직접 관리한다.

# SQL 로그 끄기: 요청마다 SQL이 여러 줄씩 찍혀서 정말 봐야 할 로그가 묻힌다.
logging.level.org.hibernate.SQL=info

# JSP 개발 모드 끄기: 배포한 뒤에는 JSP가 바뀌지 않으므로 요청마다 파일이 바뀌었는지 확인할 필요가 없다.
server.servlet.jsp.init-parameters.development=false

# /actuator/health에 DB 종류·디스크 용량 같은 내부 정보를 보여 주지 않는다. (밖에서는 UP/DOWN만 보인다)
management.endpoint.health.show-details=never

# Nginx 뒤에서 진짜 사용자 IP 받기
# 요청을 Nginx가 대신 전달하므로, 그대로 두면 모든 요청의 IP가 Nginx 컨테이너 주소 하나로 보인다.
# → 업로드 횟수 제한이 모든 사용자를 한 사람으로 세어서, 누군가 3번 올리면 모두가 막힌다.
# native: Nginx가 적어 보낸 X-Forwarded-For 헤더에서 진짜 IP를 꺼내 request.getRemoteAddr()로 돌려준다.
# 내부망 주소(Docker 등)에서 온 헤더만 믿으므로, 사용자가 직접 보낸 가짜 헤더는 무시된다.
server.forward-headers-strategy=native

# 사진 저장소: S3 (버킷 이름은 서버의 .env에 APP_S3_BUCKET으로 넣는다)
app.image-storage=s3

# CSS 주소에 파일 내용의 지문(해시)을 붙인다: /css/app.css → /css/app-3f2a….css
# 브라우저는 한 번 받은 CSS를 저장해 두고 다시 쓰기 때문에, 배포로 CSS가 바뀌어도 예전 모양이 보일 수 있다.
# 내용이 바뀌면 주소가 바뀌므로 브라우저는 새 파일로 알고 받는다. → 같은 주소는 내용이 절대 안 바뀌니 1년 동안 저장해 둬도 된다.
# (JSP에서 <c:url value="/css/app.css" />로 써야 지문이 붙는다. 개발 PC에서는 꺼져 있어 /css/app.css 그대로)
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
