# 모든 테스트에 덧씌우는 설정 (main의 application.properties보다 우선한다)
# 내 PC의 .env에 진짜 키가 있어도 테스트는 절대 실제 AI를 부르지 않게(돈이 나가지 않게) 키를 비운다.
app.gemini.api-key=

# 테스트는 설정 조합(컨텍스트)마다 DB 연결 묶음(Hikari)을 따로 만들고, 전체 테스트가 끝날 때까지 남겨 둔다.
# 기본값은 묶음마다 연결 10개를 미리 열어 두어서, 컨텍스트가 늘면 MySQL의 연결 한도(151)에 걸린다
# (JM-107: 실제 Tomcat을 띄우는 테스트를 더하자 전체 테스트에서 "Too many connections"로 컨텍스트 하나가 뜨지 못했다).
# 미리 여는 연결을 1개로 줄인다. 동시에 더 필요하면 그때 늘어난다 (최대 10개는 그대로)
spring.datasource.hikari.minimum-idle=1

# 사용자 흐름(JM-92)을 일꾼 스레드 없이 바로 저장한다: 테스트가 저장한 줄을 바로 읽고, 테스트의 트랜잭션과 함께 되돌린다
app.page-flow.async=false
# 줄에서 버려진 분석 다시 넣기(JM-110)는 테스트에서 끈다: 일정에 따라 돌면 다른 테스트가 만든 PENDING을 건드린다.
# 다시 넣기 자체는 PendingAnalysisRequeuerTest가 직접 부른다
app.analysis.requeue.enabled=false
# 태그 채우기(JM-83)도 테스트에서 끈다: 일정에 따라 돌면 다른 테스트가 만든 글의 태그를 건드린다. 채우기 자체는 PostTagFillerTest가 직접 부른다
app.tags.fill.enabled=false
