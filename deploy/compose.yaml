# 배포 서버(EC2)에서 실행하는 구성: [사용자] → nginx(80번) → app(Spring, 8080) → mysql
# 실행: deploy 폴더에서  docker compose up -d --build
# 비밀값은 같은 폴더의 .env에서 읽는다 (.env.example을 복사해서 채운다. Git에는 올라가지 않는다)

# 이 구성의 이름. 컨테이너 이름 앞에 붙는다 (macros-app-1 등)
name: macros

# x-로 시작하는 칸: Compose가 무시하는 메모 칸. 여러 서비스가 같이 쓸 설정을 한 번만 적는 데 쓴다.
# &logging: 이 설정에 "logging"이라는 이름표를 붙인다 → 아래에서 *logging으로 그대로 가져다 쓴다.
# 로그 보관: 컨테이너마다 10MB짜리 파일 3개까지만 남기고, 넘으면 오래된 것부터 지운다.
# (안 하면 로그가 끝없이 쌓여 디스크가 가득 차고 서버가 멈춘다)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 문지기: 사용자의 요청을 가장 먼저 받아서 app에 전달한다. (HTTPS는 S4-4에서 여기에 붙인다)
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    # 서버의 80번(http 기본 포트) → 컨테이너 80번. 밖에 열리는 것은 nginx뿐이다.
    ports: ["80:80"]
    volumes:
      # 우리가 쓴 설정 파일을 Nginx 기본 설정 자리에 끼워 넣는다. :ro = 읽기 전용
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # app보다 나중에 켠다
    depends_on: [app]
    environment:
      # 로그 시각을 한국 시간으로 (서버 기본값은 UTC = 한국보다 9시간 늦게 찍힌다)
      TZ: Asia/Seoul
    logging: *logging

  # Spring 서버 (backend/Dockerfile로 만든 이미지)
  app:
    # 이미지를 backend 폴더의 Dockerfile로 만든다 (--build를 붙이면 매번 새로 만든다)
    build: ../backend
    image: macros-app
    restart: unless-stopped
    # ports가 없다: app은 밖에 열지 않고, 같은 Compose 안의 nginx만 접속할 수 있다.
    environment:
      # application-prod.properties를 켠다
      SPRING_PROFILES_ACTIVE: prod
      # ${이름}: .env의 값을 넣는다
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_S3_BUCKET: ${APP_S3_BUCKET:-}
      # :- 뒤는 .env에 값이 없을 때 쓰는 기본값 (AI 기능은 아직 배포 전이라 비어 있어도 된다)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # JVM 옵션: 자바가 쓸 메모리(힙)를 최대 512MB로 묶는다.
      # 서버 메모리 2GB를 MySQL·Nginx·운영체제와 나눠 쓰므로, 자바가 메모리를 끝없이 늘리지 않게 한다.
      JAVA_TOOL_OPTIONS: -Xmx512m
      TZ: Asia/Seoul
    # 컨테이너 전체 메모리 한도 (힙 512MB + 자바 자체가 쓰는 메모리). 넘으면 이 컨테이너만 꺼졌다가 다시 켜진다.
    mem_limit: 1g
    depends_on:
      # MySQL이 접속을 받을 준비가 된 뒤에 켠다 (안 그러면 DB 연결 실패로 켜지자마자 꺼진다)
      mysql:
        condition: service_healthy
    # 상태 검사: 서버가 요청을 받을 수 있는지 30초마다 확인한다 (docker ps에 healthy로 표시)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      # 켜지는 데 걸리는 시간. 이 동안의 실패는 세지 않는다
      start_period: 60s
      retries: 3
    logging: *logging

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # ports가 없다: DB는 밖에 열지 않는다 (app만 접속)
    environment:
      MYSQL_DATABASE: macros
      MYSQL_USER: macros
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      # DB 파일은 컨테이너가 아니라 Docker 볼륨에 둔다 → 컨테이너를 새로 만들어도 데이터가 남는다
      # (서버 자체를 지우면 같이 사라지므로 매일 S3에 백업한다: S4-3)
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

volumes:
  mysql-data:
