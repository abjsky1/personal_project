# 배포 서버(EC2)에서 실행하는 구성: [사용자] → nginx(80, 443번) → app1 또는 app2(Spring, 8080) → RDS(MySQL, 서버 밖)
#                                                └ certbot: 예비 인증서(Let's Encrypt) 갱신 (nginx와 볼륨을 공유)
# app은 같은 설정의 app1, app2 두 자리가 있고 평소에는 한쪽만 켜져 있다 (무중단 배포, JM-62).
#   배포할 때 꺼져 있던 쪽을 새 버전으로 켜서 확인하고 데운 뒤, nginx가 그쪽으로 넘어가면 옛 쪽을 끈다 (둘이 같이 뜨는 것은 1분 안쪽).
#   nginx가 지금 어느 쪽을 보는지는 nginx/active-app.inc에 적혀 있다 (deploy.sh가 쓴다)
# DB는 이 파일에 없다: AWS가 관리하는 RDS를 쓰고, app이 .env의 DB_HOST(RDS 주소)로 접속한다.
# 평소 배포: main에 push하면 GitHub Actions가 이미지를 만들고 서버에서 deploy.sh를 실행한다 (사람이 할 일 없음)
# 주의: 서비스 이름 없이 docker compose up -d 를 하면 app1과 app2가 둘 다 켜진다 (자바 둘, 메모리 약 1GB).
#   서버에서 직접 켤 때는 이름을 붙인다: docker compose up -d nginx certbot  /  app은 deploy.sh로 (.env를 바꾼 뒤에는 bash deploy.sh current)
# nginx/active-app.inc를 지우지 않는다: 없으면 nginx는 app1을 본다
# 처음 올릴 때(새 서버): deploy 폴더에서  docker compose up -d nginx certbot  다음  bash deploy.sh <SHA>
# 비상시(GHCR 장애이고 서버에도 이미지가 없을 때, 서버에서 빌드): APP1_TAG=local-<SHA> docker compose build app1 && bash deploy.sh local-<SHA>
# 비밀값은 같은 폴더의 .env에서 읽는다 (.env.example을 복사해서 채운다. Git에는 올라가지 않는다)
# 인증서: 서비스에는 가비아에서 산 인증서를 쓴다 (JM-67. 파일은 서버의 nginx/ssl 폴더에만 있고 Git에는 없다).
#         certbot의 Let's Encrypt 인증서는 예비. 설명은 기획서 10절 "HTTPS", 교체 순서는 16절 "인증서 교체"

# 이 구성의 이름. 컨테이너 이름 앞에 붙는다 (macros-app1-1 등)
name: macros

# x-로 시작하는 칸: Compose가 무시하는 메모 칸. 여러 서비스가 같이 쓸 설정을 한 번만 적는 데 쓴다.
# &이름: 이 설정에 이름표를 붙인다 → 아래에서 *이름으로 그대로 가져다 쓴다.

# 서버 안에만 남기는 로그 (certbot): 컨테이너마다 10MB짜리 파일 3개까지, 넘으면 오래된 것부터 지운다.
# (안 하면 로그가 끝없이 쌓여 디스크가 가득 차고 서버가 멈춘다) 컨테이너를 새로 만들면 사라진다.
x-logging-local: &logging-local
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# AWS CloudWatch Logs로 보내는 기록 (app1, app2, nginx): 배포로 컨테이너가 바뀌어도 90일 남고, 콘솔에서 검색할 수 있다.
# 로그 그룹 /macros/server 안에 컨테이너 이름으로 스트림이 생긴다 (macros-app1-1, macros-app2-1, macros-nginx-1). 보관 기간 90일은 콘솔에서 로그 그룹에 설정한다 (처리방침 "이용 기록 3개월").
# 서버의 Docker가 EC2 역할(macros-ec2의 macros-logs 정책)로 보낸다. docker compose logs 도 그대로 된다 (Docker가 사본을 서버에 잠시 남김).
# app은 JSON 줄이다 (traceId로 검색, 경보 app-error와 photo-held가 본다). nginx는 IP 없는 접속 기록 글자 줄이다 (2026-11-26부터, JM-91).
#   사람이 화면을 다 받기까지 걸린 시간(전송 포함)과 502는 nginx 기록에만 있다. 경보는 JSON 줄만 보므로 nginx 줄에는 울리지 않는다.
#   IP가 들어가는 nginx의 에러 줄은 보내지 않는다 (nginx/default.conf의 error_log, 컨테이너 안 파일)
# 맨 아래 두 줄은 CloudWatch가 느리거나 닿지 않을 때를 위한 것이다 (nginx는 2026-11-26 PR #61, app은 같은 날 PR #62):
#   mode: non-blocking: 보내지 못한 기록을 메모리(max-buffer-size, 4MB)에 모아 두고, 넘치면 새 기록을 버린다. 컨테이너는 기다리지 않는다.
#   기본값(blocking)이면 켤 때 CloudWatch에 스트림을 만들지 못한 컨테이너는 뜨지 않고(서버를 다시 켤 때라면 사이트가 멈춘다),
#   오래 막히면 기록을 넘기지 못한 app과 nginx가 요청 처리까지 기다릴 수 있다. 사이트가 멈추는 것보다 기록 몇 줄을 잃는 편이 낫다.
# 주의: non-blocking이어도 켜질 때 스트림을 끝내 만들지 못하면(권한, 긴 CloudWatch 장애) 보내지 못한 줄을 4,096줄까지 쥐고 있다가,
#   그 뒤 그 컨테이너를 끌 때 끝나지 않는다 (Docker 25). 그래서 배포 뒤에는 스트림을 만들지 못한 오류가 없는지 본다 (docs/performance.md 5절)
x-logging-cloud: &logging-cloud
  driver: awslogs
  options:
    awslogs-region: ap-northeast-2
    awslogs-group: /macros/server
    awslogs-create-group: "true"
    tag: "{{.Name}}"
    mode: non-blocking
    max-buffer-size: 4m

# Spring 서버(backend/Dockerfile로 만든 이미지)의 설정. app1과 app2가 이 묶음을 그대로 가져다 쓴다 (아래 services의 <<: *app).
# 두 자리의 설정이 어긋나지 않게 한 번만 적는다. 다른 것은 서비스 이름과 받을 이미지의 태그뿐이다.
# 주의: 서비스 쪽에 이 묶음과 같은 칸(environment 등)을 다시 적으면 그 칸은 합쳐지지 않고 통째로 바뀐다.
# *logging-cloud를 가리키므로 x-logging-cloud보다 아래에 있어야 한다.
x-app: &app
  # build는 내 PC 시험용, 비상용으로 남겨 둔다: APP1_TAG=local-<SHA> docker compose build app1 으로 서버에서 만든 뒤 bash deploy.sh local-<SHA> (맨 위 주석)
  build: ../backend
  restart: unless-stopped
  # ports가 없다: app은 밖에 열지 않고, 같은 Compose 안의 nginx만 접속할 수 있다.
  environment:
    # application-prod.properties를 켠다
    SPRING_PROFILES_ACTIVE: prod
    # ${이름}: .env의 값을 넣는다
    # DB_HOST: RDS 주소. :- 뒤의 mysql은 .env에 값이 없을 때 쓰는 기본값으로,
    # 내 PC 시험용 compose.local.yaml이 띄우는 mysql 컨테이너를 가리킨다.
    DB_HOST: ${DB_HOST:-mysql}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    APP_S3_BUCKET: ${APP_S3_BUCKET:-}
    # AI 분석용 키. 비어 있으면 글은 올라가지만 분석은 실패로 저장된다.
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    # 운영자 API 열쇠. 비어 있으면 운영자 기능이 꺼진다.
    APP_ADMIN_TOKEN: ${APP_ADMIN_TOKEN:-}
    # 관리자 화면 비밀번호 (JM-82). 비어 있으면 관리자 화면이 꺼진다
    APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
    # JVM 옵션: 자바가 쓸 메모리(힙)를 최대 512MB로 묶는다.
    # 서버 메모리 2GB를 Nginx, 운영체제와 나눠 쓰므로(DB는 서버 밖 RDS), 자바가 메모리를 끝없이 늘리지 않게 한다.
    # 배포하는 1분 안쪽은 app 둘이 같이 뜬다: 2026-11-23 서버 가용 908MB, app 하나 약 380 ~ 584MiB로 계산해 남는다 (JM-62)
    JAVA_TOOL_OPTIONS: -Xmx512m
    TZ: Asia/Seoul
  # IP 위치 파일(DB-IP 무료판, JM-86): 서버의 deploy/geoip 폴더(git에 없음)를 읽기 전용으로 붙인다.
  # 파일이 없어도 app은 켜지고 방문 지역은 "알 수 없음"으로 센다. 파일을 넣는 순서는 기획서 16절
  # 파일은 힙에 올리지 않고 운영체제가 필요한 부분만 읽는다 (아래 메모리 한도와 따로)
  volumes:
    - ./geoip:/app/geoip:ro
  # 컨테이너 전체 메모리 한도 (힙 512MB + 자바 자체가 쓰는 메모리). 넘으면 이 컨테이너만 꺼졌다가 다시 켜진다.
  mem_limit: 1g
  # 끌 때 기다려 주는 시간. 그동안 Spring이 끄는 단계마다(최대 30초씩) 받던 요청과 뒤에서 하던 AI 분석(한 번에 최대 35초)을 마저 끝낸다.
  # Docker의 기본값은 10초라서, 그 뒤에는 하던 일이 있어도 강제로 끈다 (JM-62). 하던 일이 없으면 1초 안에 꺼진다
  stop_grace_period: 60s
  # 상태 검사: 서버가 요청을 받을 수 있는지 30초마다 확인한다 (docker ps에 healthy로 표시)
  # 배포 때 새 app이 켜졌는지는 deploy.sh가 nginx 컨테이너에서 /actuator/health를 직접 불러 확인한다 (30초를 기다리지 않게)
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
    interval: 30s
    timeout: 5s
    # 켜지는 데 걸리는 시간. 이 동안의 실패는 세지 않는다
    start_period: 60s
    retries: 3
  logging: *logging-cloud

services:
  # 문지기: 사용자의 요청을 가장 먼저 받아서 app에 전달한다. https도 여기서 푼다.
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    # 서버의 80번(http), 443번(https) → 컨테이너의 같은 번호. 밖에 열리는 것은 nginx뿐이다.
    ports: ["80:80", "443:443"]
    volumes:
      # 우리가 쓴 설정(nginx/default.conf)을 Nginx 설정 폴더 자리에 끼워 넣는다. :ro = 읽기 전용
      # 파일 하나가 아니라 폴더를 붙이는 이유: 파일 하나를 붙이면 git pull이 파일을 새로 만들 때 컨테이너는 옛 파일을 계속 본다
      # (troubleshooting/2026-11-04-nginx-bind-mount-stale.md)
      # 이 폴더 안의 ssl 폴더(인증서와 비밀키, 서버에만 있다)도 함께 들어가서 /etc/nginx/conf.d/ssl 로 보인다 (JM-67)
      - ./nginx:/etc/nginx/conf.d:ro
      # certbot이 갱신해 두는 예비 인증서(읽기만) / Let's Encrypt 확인용 파일(읽기만)
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # 6시간마다 설정을 다시 읽는다(reload, 끊김 없음). 인증서 파일이 바뀌어 있으면 이때 적용된다 (ssl 폴더의 파일도, certbot의 예비 인증서도).
    # $${!}: 방금 띄운 sleep의 번호. 컨테이너를 끌 때 sleep이 바로 끝나도록 wait로 기다린다. ($$는 Compose가 $로 바꾼다)
    command: ["sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    # depends_on(app보다 나중에 켜기)은 두지 않는다 (JM-62):
    # - app1, app2를 둘 다 적으면 nginx를 켤 때 자바 둘이 같이 켜진다. 평소에는 한쪽만 켜져 있어야 한다
    # - nginx는 app 주소를 요청 때마다 이름으로 묻기 때문에(default.conf의 resolver), app이 없어도 켜진다 (그동안은 502)
    environment:
      # 로그 시각을 한국 시간으로 (서버 기본값은 UTC = 한국보다 9시간 늦게 찍힌다)
      TZ: Asia/Seoul
    # 접속 기록은 CloudWatch로 (위의 x-logging-cloud, app과 같은 설정). 형식은 nginx/default.conf의 log_format noip (IP 없음)
    logging: *logging-cloud

  # 예비 인증서 관리 (JM-67부터 예비): 서비스에는 가비아에서 산 인증서를 쓰고, Let's Encrypt 인증서는 문제가 생기면 되돌아갈 수 있게 계속 갱신해 둔다.
  # Let's Encrypt 인증서는 90일짜리라서, 12시간마다 "만료 30일 전이면 갱신"을 시도한다.
  # webroot 방식: certbot이 /var/www/certbot에 확인용 파일을 놓고, nginx(80번)가 그 파일을 Let's Encrypt에 보여 준다.
  # 처음 발급은 standalone 방식으로 한 번만 직접 실행한다 (기획서 10절). 평소에는 이 컨테이너가 조용히 돌기만 한다.
  certbot:
    image: certbot/certbot:v5.9.0
    restart: unless-stopped
    volumes:
      # 인증서, 계정 정보 / 확인용 파일 (둘 다 nginx와 공유)
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # trap exit TERM: 컨테이너를 끌 때 바로 끝나게. --quiet: 갱신할 게 없으면 아무것도 찍지 않는다.
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    logging: *logging-local

  # Spring 서버의 두 자리 (JM-62). 설정은 위의 x-app 묶음을 그대로 쓰고(<<: *app), 받을 이미지만 따로 적는다.
  # 평소에는 GitHub Actions가 만들어 GHCR(GitHub 컨테이너 저장소)에 올린 이미지를 받는다.
  # 태그 = 커밋 SHA. 자리마다 .env의 APP1_TAG, APP2_TAG에 적혀 있고(deploy.sh가 켜는 쪽의 값만 바꾼다), 없으면 latest.
  # 태그를 자리마다 따로 두는 이유: 하나를 같이 쓰면, 누가 docker compose up -d 를 했을 때 꺼져 있던 쪽까지 새 태그로 다시 만들어진다.
  # 이름에 밑줄(app_1 등)을 쓰지 않는다: deploy.sh가 nginx 컨테이너에서 http://app1:8080 처럼 이름으로 부르는데,
  # 밑줄이 있으면 Tomcat이 주소를 잘못된 도메인으로 보고 400을 준다 (2026-11-23 확인, app_blue 400, app-blue 200)
  app1:
    <<: *app
    image: ghcr.io/abjsky1/macros-app:${APP1_TAG:-latest}

  app2:
    <<: *app
    image: ghcr.io/abjsky1/macros-app:${APP2_TAG:-latest}

# 이름 있는 볼륨: 컨테이너를 지우고 다시 만들어도 남는 저장 공간 (docker compose down -v 를 하면 지워진다 → 예비 인증서를 다시 받아야 한다)
volumes:
  certbot-etc:
  certbot-www:
