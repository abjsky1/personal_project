# 배포 서버(EC2)에서 실행하는 구성: [사용자] → nginx(80·443번) → app(Spring, 8080) → RDS(MySQL, 서버 밖)
#                                                └ certbot: https 인증서 발급·갱신 (nginx와 볼륨을 공유)
# DB는 이 파일에 없다: AWS가 관리하는 RDS를 쓰고, app이 .env의 DB_HOST(RDS 주소)로 접속한다.
# 실행: deploy 폴더에서  docker compose up -d --build
# 비밀값은 같은 폴더의 .env에서 읽는다 (.env.example을 복사해서 채운다. Git에는 올라가지 않는다)
# 인증서를 처음 받는 순서(서버에 한 번만): 기획서 10절 "HTTPS"

# 이 구성의 이름. 컨테이너 이름 앞에 붙는다 (macros-app-1 등)
name: macros

# x-로 시작하는 칸: Compose가 무시하는 메모 칸. 여러 서비스가 같이 쓸 설정을 한 번만 적는 데 쓴다.
# &logging: 이 설정에 "logging"이라는 이름표를 붙인다 → 아래에서 *logging으로 그대로 가져다 쓴다.
# 로그 보관: 컨테이너마다 10MB짜리 파일 3개까지만 남기고, 넘으면 오래된 것부터 지운다.
# (안 하면 로그가 끝없이 쌓여 디스크가 가득 차고 서버가 멈춘다)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 문지기: 사용자의 요청을 가장 먼저 받아서 app에 전달한다. https도 여기서 푼다.
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    # 서버의 80번(http)·443번(https) → 컨테이너의 같은 번호. 밖에 열리는 것은 nginx뿐이다.
    ports: ["80:80", "443:443"]
    volumes:
      # 우리가 쓴 설정 파일을 Nginx 기본 설정 자리에 끼워 넣는다. :ro = 읽기 전용
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # certbot이 발급한 인증서(읽기만) / Let's Encrypt 확인용 파일(읽기만)
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # 6시간마다 설정을 다시 읽어(reload, 끊김 없음) certbot이 갱신해 둔 인증서를 적용한다.
    # $${!}: 방금 띄운 sleep의 번호. 컨테이너를 끌 때 sleep이 바로 끝나도록 wait로 기다린다. ($$는 Compose가 $로 바꾼다)
    command: ["sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    # app보다 나중에 켠다
    depends_on: [app]
    environment:
      # 로그 시각을 한국 시간으로 (서버 기본값은 UTC = 한국보다 9시간 늦게 찍힌다)
      TZ: Asia/Seoul
    logging: *logging

  # 인증서 관리: Let's Encrypt 인증서는 90일짜리라서, 12시간마다 "만료 30일 전이면 갱신"을 시도한다.
  # webroot 방식: certbot이 /var/www/certbot에 확인용 파일을 놓고, nginx(80번)가 그 파일을 Let's Encrypt에 보여 준다.
  # 처음 발급은 standalone 방식으로 한 번만 직접 실행한다 (기획서 10절). 평소에는 이 컨테이너가 조용히 돌기만 한다.
  certbot:
    image: certbot/certbot:v5.9.0
    restart: unless-stopped
    volumes:
      # 인증서·계정 정보 / 확인용 파일 (둘 다 nginx와 공유)
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # trap exit TERM: 컨테이너를 끌 때 바로 끝나게. --quiet: 갱신할 게 없으면 아무것도 찍지 않는다.
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    logging: *logging

  # Spring 서버 (backend/Dockerfile로 만든 이미지)
  app:
    # 이미지를 backend 폴더의 Dockerfile로 만든다 (--build를 붙이면 매번 새로 만든다)
    build: ../backend
    image: macros-app
    restart: unless-stopped
    # ports가 없다: app은 밖에 열지 않고, 같은 Compose 안의 nginx만 접속할 수 있다.
    environment:
      # application-prod.properties를 켠다
      SPRING_PROFILES_ACTIVE: prod
      # ${이름}: .env의 값을 넣는다
      # DB_HOST: RDS 주소. :- 뒤의 mysql은 .env에 값이 없을 때 쓰는 기본값으로,
      # 내 PC 시험용 compose.local.yaml이 띄우는 mysql 컨테이너를 가리킨다.
      DB_HOST: ${DB_HOST:-mysql}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_S3_BUCKET: ${APP_S3_BUCKET:-}
      # AI 분석용 키. 비어 있으면 글은 올라가지만 분석은 실패로 저장된다.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # JVM 옵션: 자바가 쓸 메모리(힙)를 최대 512MB로 묶는다.
      # 서버 메모리 2GB를 Nginx·운영체제와 나눠 쓰므로(DB는 서버 밖 RDS), 자바가 메모리를 끝없이 늘리지 않게 한다.
      JAVA_TOOL_OPTIONS: -Xmx512m
      TZ: Asia/Seoul
    # 컨테이너 전체 메모리 한도 (힙 512MB + 자바 자체가 쓰는 메모리). 넘으면 이 컨테이너만 꺼졌다가 다시 켜진다.
    mem_limit: 1g
    # 상태 검사: 서버가 요청을 받을 수 있는지 30초마다 확인한다 (docker ps에 healthy로 표시)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      # 켜지는 데 걸리는 시간. 이 동안의 실패는 세지 않는다
      start_period: 60s
      retries: 3
    logging: *logging

# 이름 있는 볼륨: 컨테이너를 지우고 다시 만들어도 남는 저장 공간 (docker compose down -v 를 하면 지워진다 → 인증서를 다시 받아야 한다)
volumes:
  certbot-etc:
  certbot-www:
