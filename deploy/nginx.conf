# Nginx 설정: 80번으로 들어온 요청을 Spring(app 컨테이너의 8080번)에 그대로 전달한다.
# (HTTPS는 S4-4 도메인 연결 때 추가한다)
server {
    listen 80;

    # 에러 화면과 응답 헤더에 Nginx 버전을 표시하지 않는다 (버전별로 알려진 약점을 노리는 공격을 줄인다)
    server_tokens off;

    # 요청 크기 한도(업로드 사진). 기본값은 1MB라서 그대로 두면 휴대폰 사진이 Nginx에서 막힌다.
    # 20m: Spring 쪽 Tomcat이 끝까지 받아 주는 크기(application.properties의 max-swallow-size=20MB)와 맞춘다.
    # → 10MB를 조금 넘는 사진은 Spring까지 가서 우리 에러 화면("10MB까지")이 보이고, 20MB가 넘으면 Nginx의 413 화면이 보인다.
    client_max_body_size 20m;

    location / {
        # app: Compose 서비스 이름이 곧 주소다
        proxy_pass http://app:8080;
        # 사용자가 접속한 주소(도메인)를 그대로 알려 준다 (없으면 Spring은 "app"으로 접속한 줄 안다)
        proxy_set_header Host $host;
        # 진짜 사용자 IP. 우리 앞에 다른 중계 서버가 없으므로, 사용자가 보낸 값은 버리고 Nginx가 직접 본 주소로 덮어쓴다.
        proxy_set_header X-Forwarded-For $remote_addr;
        # http로 왔는지 https로 왔는지 (HTTPS를 붙이면 https가 전달된다)
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
