# 내 PC 시험용 Nginx 설정: http(80번)만 있고 인증서가 없다. 배포 서버는 nginx.conf(https)를 쓴다.
# compose.local.yaml이 nginx.conf 대신 이 파일을 끼워 넣는다. 전달 설정(proxy_*)은 nginx.conf의 443번 블록과 같게 유지한다.
server {
    listen 80;

    server_tokens off;

    # 요청 크기 한도(업로드 사진). nginx.conf와 같은 값
    client_max_body_size 20m;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
