# 내 PC 시험용 Nginx 설정: http(80번)만 있고 인증서가 없다. 배포 서버는 nginx.conf(https)를 쓴다.
# compose.local.yaml이 nginx.conf 대신 이 파일을 끼워 넣는다. 전달 설정(proxy_*)은 nginx.conf의 443번 블록과 같게 유지한다.

# 접속 기록에 IP를 남기지 않는 형식 (nginx.conf와 같음)
log_format noip '$time_local "$request" $status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;

    server_tokens off;
    access_log /dev/stdout noip;

    # 요청 크기 한도(업로드 사진). nginx.conf와 같은 값
    client_max_body_size 20m;

    # app 주소를 10초마다 다시 묻는다 (nginx.conf와 같은 이유: app 컨테이너를 새로 만들어도 502가 안 나게)
    resolver 127.0.0.11 valid=10s;

    location / {
        set $app http://app:8080;
        proxy_pass $app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
