# Nginx 설정 (배포 서버): [사용자] → Nginx(80, 443번) → Spring(app 컨테이너의 8080번)
# - 80번(http): 인증서 발급, 갱신 확인 요청에만 직접 답하고, 나머지는 전부 https 주소로 보낸다
# - 443번(https): 실제 서비스. 인증서는 Let's Encrypt (certbot 컨테이너가 발급, 갱신한다, compose.yaml 참고)
# 내 PC에서 시험할 때는 http만 있는 nginx-local/default.conf를 대신 쓴다 (compose.local.yaml이 폴더째 바꿔 끼운다)

# 접속 기록(access log)의 형식: 기본 형식과 달리 사용자 IP를 남기지 않는다.
# 처리방침에 "접속 IP는 서버 메모리에만 최대 1일 보관"이라고 적었기 때문. (횟수 제한에 걸린 IP는 app이 해시로만 기록한다)
# 남기는 것: 시각, 요청, 상태 코드, 응답 크기, 걸린 시간, 브라우저 종류
log_format noip '$time_local "$request" $status $body_bytes_sent $request_time "$http_user_agent"';

# ── 80번: http로 온 요청 ──
server {
    listen 80;
    server_name jjikmuk.com www.jjikmuk.com;
    server_tokens off;
    access_log /dev/stdout noip;

    # Let's Encrypt가 "이 도메인이 정말 네 서버냐"를 확인하는 경로.
    # certbot이 이 폴더에 확인용 파일을 놓으면, Let's Encrypt가 http://jjikmuk.com/.well-known/acme-challenge/파일 로 읽어 간다.
    # (certbot 컨테이너와 같은 볼륨을 공유한다)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 밖의 http 요청은 모두 https 주소로 영구 이동(301). www로 왔어도 jjikmuk.com 하나로 모은다.
    location / {
        return 301 https://jjikmuk.com$request_uri;
    }
}

# ── 443번: www.jjikmuk.com → jjikmuk.com (주소를 하나로 모은다) ──
server {
    listen 443 ssl;
    http2 on;
    server_name www.jjikmuk.com;
    server_tokens off;
    access_log /dev/stdout noip;
    ssl_certificate    /etc/letsencrypt/live/jjikmuk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jjikmuk.com/privkey.pem;
    return 301 https://jjikmuk.com$request_uri;
}

# ── 443번: 실제 서비스 ──
server {
    listen 443 ssl;
    http2 on;
    server_name jjikmuk.com;

    # 에러 화면과 응답 헤더에 Nginx 버전을 표시하지 않는다 (버전별로 알려진 약점을 노리는 공격을 줄인다)
    server_tokens off;
    # 접속 기록은 IP 없는 형식으로 (파일 맨 위 log_format noip)
    access_log /dev/stdout noip;

    # 인증서: certbot이 발급해 둔 파일 (compose.yaml의 certbot-etc 볼륨을 읽기 전용으로 붙인다)
    # fullchain = 우리 인증서 + 중간 인증서, privkey = 비밀키. 갱신돼도 같은 경로의 파일이 바뀌므로 nginx를 reload만 하면 된다.
    ssl_certificate     /etc/letsencrypt/live/jjikmuk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jjikmuk.com/privkey.pem;
    # 오래된 TLS(1.0, 1.1)는 받지 않는다. 암호 방식은 Nginx 기본값(충분히 안전)을 쓴다.
    ssl_protocols TLSv1.2 TLSv1.3;
    # 같은 사용자의 다음 접속에서는 TLS 협상을 줄여 빨라진다
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: 한 번 https로 접속한 브라우저는 이후 http://로 쳐도 스스로 https로 간다 (6개월 동안 기억)
    add_header Strict-Transport-Security "max-age=15552000" always;

    # 요청 크기 한도(업로드 사진). 기본값은 1MB라서 그대로 두면 휴대폰 사진이 Nginx에서 막힌다.
    # 20m: Spring 쪽 Tomcat이 끝까지 받아 주는 크기(application.properties의 max-swallow-size=20MB)와 맞춘다.
    # → 10MB를 조금 넘는 사진은 Spring까지 가서 우리 에러 화면("10MB까지")이 보이고, 20MB가 넘으면 Nginx의 413 화면이 보인다.
    client_max_body_size 20m;

    # app의 주소를 Docker 안의 이름 풀이 서버(127.0.0.11)에 10초마다 다시 묻는다.
    # 안 하면 nginx가 켜질 때 알아낸 app 주소만 계속 기억해서, 배포로 app 컨테이너가 새로 만들어지면(주소가 바뀌면) 502가 난다.
    # 변수($app)에 담아 proxy_pass에 넣어야 다시 묻는 동작이 켜진다.
    resolver 127.0.0.11 valid=10s;

    location / {
        # app: Compose 서비스 이름이 곧 주소다
        set $app http://app:8080;
        proxy_pass $app;
        # 사용자가 접속한 주소(도메인)를 그대로 알려 준다 (없으면 Spring은 "app"으로 접속한 줄 안다)
        proxy_set_header Host $host;
        # 진짜 사용자 IP. 우리 앞에 다른 중계 서버가 없으므로, 사용자가 보낸 값은 버리고 Nginx가 직접 본 주소로 덮어쓴다.
        proxy_set_header X-Forwarded-For $remote_addr;
        # https로 왔다고 알려 준다 → Spring이 리다이렉트 주소와 세션 쿠키(Secure)를 https 기준으로 만든다
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
